    <!-- upper brim plane -->
    <path d="M25 80
             C45 78 68 81 90 84
             C116 88 143 93 169 99
             C180 101 186 104 188 107
             C168 107 143 104 118 100
             C91 96 65 92 42 88
             C32 86 26 83 25 80 Z"
          fill="#6a5260"/>

    <!-- brim lower shadow -->
    <path d="M28 91
             C50 97 71 99 91 104
             C116 108 142 113 169 116
             C181 117 189 116 190 111
             C185 114 176 113 166 111
             C139 107 114 102 89 98
             C65 94 44 89 28 85
             C23 84 21 86 28 91 Z"
          fill="#3b3040"/>

    <!-- green band -->
    <path d="M77 69
             C91 71 108 74 125 78
             C136 80 146 83 154 86
             L153 101
             C141 98 129 95 116 92
             C101 89 87 86 73 84
             Z"
          fill="#4b5b4d" stroke="#303b37" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- band highlight -->
    <path d="M78 70 C93 72 108 75 123 78 L121 88 C105 85 89 82 75 80 Z"
          fill="#657260"/>

    <!-- band shadow -->
    <path d="M121 78 C134 81 145 83 154 86 L153 101 C143 98 132 95 121 92 Z"
          fill="#39463d"/>

    <!-- buckle -->
    <path d="M99 72
             C99 68 101 66 105 66
             L116 68
             C120 69 122 72 121 76
             L119 82
             C118 85 115 86 111 85
             L101 83
             C98 82 97 78 99 72 Z"
          fill="#e5a83e" stroke="#9b6b2e" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- buckle face -->
    <path d="M102 69 C106 68 111 69 116 70 C119 71 120 73 119 76 L117 81 C116 83 114 84 111 83 L102 81 C100 80 100 78 101 74 Z"
          fill="#f0bd57"/>
  </g>

  <g id="hat-highlights">
    <!-- brim edge highlight -->
    <path d="M29 81 C48 80 68 83 89 86 C116 90 143 95 168 101"
          fill="none" stroke="#806572" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>

    <!-- crown soft highlight -->
    <path d="M105 40 C113 30 124 22 133 19"
          fill="none" stroke="#9a7881" stroke-width="2" stroke-linecap="round" opacity=".45"/>

    <!-- buckle glint -->
    <path d="M103 70 C106 69 109 69 112 70"
          fill="none" stroke="#ffe09a" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  </g>

  <g id="hat-shadows">
    <!-- seam under band -->
    <path d="M76 83 C94 86 109 89 123 93 C134 96 144 98 153 101"
          fill="none" stroke="#28322e" stroke-width="1.3" opacity=".7"/>

    <!-- crown fold -->
    <path d="M132 37 C127 47 130 62 135 77"
          fill="none" stroke="#30293a" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
  </g>
</svg>