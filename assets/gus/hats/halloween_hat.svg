             C81 78 88 61 99 44
             C108 30 119 18 132 15
             C142 13 149 17 153 24
             C157 31 155 39 162 43
             C167 46 174 45 177 43
             C174 51 166 55 157 52
             C151 50 148 45 145 40
             C142 35 138 34 135 37
             C131 41 133 51 136 61
             C140 73 142 82 142 91
             Z"
          fill="#51404f" stroke="#332d3d" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- crown light plane -->
    <path d="M83 87
             C87 73 94 57 104 43
             C114 29 126 19 136 18
             C129 25 124 35 122 47
             C120 60 124 74 128 88
             Z"
          fill="#725765"/>

    <!-- crown shadow plane -->
