             C126 73 121 59 122 47
             C123 35 128 26 136 18
             C145 17 151 22 153 29
             C155 36 151 42 156 49
             C151 46 147 40 143 39
             C138 38 135 43 135 51
             C136 65 143 78 142 91
             Z"
